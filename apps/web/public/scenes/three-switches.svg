<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t">
  <title id="t">Three switches downstairs, one light bulb upstairs</title>
  <rect width="640" height="360" fill="#eff6ff"/>
  <!-- floors -->
  <rect x="0" y="0" width="640" height="170" fill="#fefce8"/>
  <rect x="0" y="166" width="640" height="10" fill="#93c5fd"/>
  <rect x="0" y="350" width="640" height="10" fill="#93c5fd"/>
  <!-- upstairs: closed door + bulb room -->
  <rect x="380" y="20" width="230" height="146" rx="10" fill="#dbeafe"/>
  <line x1="495" y1="20" x2="495" y2="52" stroke="#1e40af" stroke-width="3"/>
  <path d="M478 52 h34 l-4 10 h-26 z" fill="#1e40af"/>
  <circle cx="495" cy="84" r="24" fill="#ffffff" stroke="#1e40af" stroke-width="4"/>
  <path d="M486 82 q9 -12 18 0" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <rect x="487" y="104" width="16" height="10" rx="2" fill="#1e40af"/>
  <text x="495" y="150" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#c084fc">?</text>
  <!-- stairs -->
  <path d="M250 350 h40 v-30 h40 v-30 h40 v-30 h40 v-30 h40 v-30 h40 v-34" fill="none" stroke="#2563eb" stroke-width="6" stroke-linejoin="round"/>
  <!-- footprints: go up only once -->
  <g fill="#ff6b9d">
    <ellipse cx="300" cy="312" rx="7" ry="4"/>
    <ellipse cx="380" cy="252" rx="7" ry="4"/>
    <ellipse cx="460" cy="192" rx="7" ry="4"/>
  </g>
  <text x="560" y="214" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#ff6b9d">1×</text>
  <!-- downstairs: switch panel -->
  <rect x="30" y="196" width="200" height="130" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="4"/>
  <g>
    <rect x="52" y="222" width="44" height="78" rx="10" fill="#4ade80"/>
    <rect x="62" y="232" width="24" height="30" rx="6" fill="#ffffff"/>
    <text x="74" y="290" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff">1</text>
  </g>
  <g>
    <rect x="108" y="222" width="44" height="78" rx="10" fill="#fb923c"/>
    <rect x="118" y="232" width="24" height="30" rx="6" fill="#ffffff"/>
    <text x="130" y="290" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff">2</text>
  </g>
  <g>
    <rect x="164" y="222" width="44" height="78" rx="10" fill="#22d3ee"/>
    <rect x="174" y="232" width="24" height="30" rx="6" fill="#ffffff"/>
    <text x="186" y="290" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff">3</text>
  </g>
  <!-- wires going up, tangled behind the wall -->
  <path d="M74 196 C 74 120, 300 140, 495 20" fill="none" stroke="#c084fc" stroke-width="3" stroke-dasharray="8 6" opacity="0.7"/>
  <path d="M130 196 C 140 110, 260 60, 495 20" fill="none" stroke="#c084fc" stroke-width="3" stroke-dasharray="8 6" opacity="0.5"/>
  <path d="M186 196 C 200 150, 360 110, 495 20" fill="none" stroke="#c084fc" stroke-width="3" stroke-dasharray="8 6" opacity="0.3"/>
</svg>
