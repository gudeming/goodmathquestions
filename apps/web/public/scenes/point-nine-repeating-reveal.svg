<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t">
  <title id="t">One third is 0.333…, so three thirds is 0.999…, which is exactly 1: the point sits right on 1.</title>
  <rect width="640" height="360" fill="#eff6ff"/>
  <rect x="20" y="16" width="600" height="328" rx="18" fill="#fefce8"/>
  <text x="320" y="78" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="700" fill="#1e40af">1/3 = 0.333…</text>
  <path d="M320 96 v40 m-12 -14 l12 14 l12 -14" fill="none" stroke="#ff6b9d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="350" y="128" font-family="sans-serif" font-size="28" font-weight="700" fill="#ff6b9d">× 3</text>
  <rect x="150" y="146" width="340" height="66" rx="33" fill="#22c55e" opacity="0.18"/>
  <text x="320" y="196" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#15803d">1 = 0.999…</text>
  <line x1="80" y1="272" x2="560" y2="272" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
  <line x1="128" y1="266" x2="128" y2="278" stroke="#93c5fd" stroke-width="2"/>
  <line x1="176" y1="266" x2="176" y2="278" stroke="#93c5fd" stroke-width="2"/>
  <line x1="224" y1="266" x2="224" y2="278" stroke="#93c5fd" stroke-width="2"/>
  <line x1="272" y1="266" x2="272" y2="278" stroke="#93c5fd" stroke-width="2"/>
  <line x1="320" y1="266" x2="320" y2="278" stroke="#93c5fd" stroke-width="2"/>
  <line x1="368" y1="266" x2="368" y2="278" stroke="#93c5fd" stroke-width="2"/>
  <line x1="416" y1="266" x2="416" y2="278" stroke="#93c5fd" stroke-width="2"/>
  <line x1="464" y1="266" x2="464" y2="278" stroke="#93c5fd" stroke-width="2"/>
  <line x1="512" y1="266" x2="512" y2="278" stroke="#93c5fd" stroke-width="2"/>
